name: Check Fly status (temporary)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Status and recent logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_NAME=$(grep '^app =' fly.toml | sed -E 's/app = "(.*)"/\1/')
          flyctl status --app "$APP_NAME"
          echo "---"
          flyctl machine list --app "$APP_NAME" --json
          echo "---"
          timeout 30 flyctl logs --app "$APP_NAME" --no-tail || true
