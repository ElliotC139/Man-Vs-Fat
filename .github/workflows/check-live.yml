name: Check live site (temporary diagnostic)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live index.html
        run: |
          echo "---HEADERS---"
          curl -sI https://match-week-food-diary.fly.dev/
          echo "---BODY---"
          curl -s https://match-week-food-diary.fly.dev/
      - name: Fetch live app.js headers
        run: curl -sI https://match-week-food-diary.fly.dev/app.js
