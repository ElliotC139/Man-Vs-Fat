<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reset QuicKcals</title>
  <!--
    A recovery page, deliberately standalone.

    A service worker holds its registration and caches per origin, and once a
    bad build has been served the app can be pinned to it: the code that would
    update itself lives in the version that isn't running. Nothing deployed to
    the server can reach in and clear that — the only routes out are the
    browser's own site-data settings, which are buried and differ per device.

    So this page is the route out. It has no stylesheet, no app.js and no
    shared dependency of any kind, precisely so that nothing it needs can be
    the stale thing. It is also excluded from the worker's cache (see sw.js),
    so it is always fetched fresh even while everything else is being served
    from a poisoned one.
  -->
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #176B3A; color: #fff;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px; box-sizing: border-box; text-align: center;
    }
    main { max-width: 30rem; }
    h1 { font-size: 1.5rem; margin: 0 0 12px; }
    p { margin: 0 0 10px; color: rgba(255,255,255,0.85); }
    #log {
      margin-top: 18px; text-align: left; font-size: 0.85rem;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      background: rgba(0,0,0,0.22); border-radius: 10px; padding: 12px;
    }
    #log div { margin-bottom: 4px; }
    a.btn {
      display: inline-block; margin-top: 18px; padding: 12px 22px;
      background: #fff; color: #176B3A; border-radius: 999px;
      font-weight: 700; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Resetting QuicKcals</h1>
    <p>Clearing this device's stored copy of the app. Your diary isn't touched — it lives on the server.</p>
    <div id="log"></div>
    <a class="btn" id="go" href="/" hidden>Open QuicKcals</a>
  </main>

  <script>
    const log = document.getElementById("log");
    const say = (text) => {
      const line = document.createElement("div");
      line.textContent = text;
      log.appendChild(line);
    };

    (async () => {
      // Workers first: while one is still registered it can keep answering
      // for the caches we are about to delete.
      try {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) await reg.unregister();
          say(`Service workers removed: ${regs.length}`);
        } else {
          say("No service worker support — nothing to remove.");
        }
      } catch (error) {
        say("Could not remove service workers: " + error.message);
      }

      try {
        if ("caches" in window) {
          const keys = await caches.keys();
          for (const key of keys) await caches.delete(key);
          say(`Caches deleted: ${keys.length}`);
        }
      } catch (error) {
        say("Could not delete caches: " + error.message);
      }

      // Deliberately NOT clearing localStorage: it holds the theme, the
      // onboarding flag and an unsent offline queue. None of that is what
      // goes stale, and throwing away a queued entry to fix a cache would be
      // losing data to solve a display problem.
      say("Done. Opening the current version…");
      document.getElementById("go").hidden = false;
      // reload(true) is long gone; a cache-busted navigation is the modern
      // equivalent and defeats any HTTP-cached copy of the shell too.
      setTimeout(() => { window.location.replace("/?fresh=" + Date.now()); }, 1200);
    })();
  </script>
</body>
</html>
