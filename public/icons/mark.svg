    A speech bubble whose counter is a K built from a knife and a fork. Drawn from
    the brand artwork: the traced outline it arrived as put every point on a
    whole-pixel grid, so each curve was a staircase of one-unit steps. The
    outlines here are the same shapes refitted as Bezier curves, with the real
    corners — the knife tip, the fork tines, the notch where the tail meets the
    body — detected and left sharp. The viewBox is square and centred on the
    artwork so every icon size crops the same way.
  -->
