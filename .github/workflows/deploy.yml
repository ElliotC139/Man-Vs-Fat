name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: fly-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # apps/volumes create is not safe to repeat, so each is gated on a
      # check first — this workflow runs on every push to main, not just once.
      - name: Ensure app and volume exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          APP_NAME=$(grep '^app =' fly.toml | sed -E 's/app = "(.*)"/\1/')
          REGION=$(grep '^primary_region =' fly.toml | sed -E 's/primary_region = "(.*)"/\1/')
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

          if ! flyctl apps list --json | jq -e --arg n "$APP_NAME" '.[] | select(.Name==$n)' > /dev/null; then
            flyctl apps create "$APP_NAME"
          fi

          if ! flyctl volumes list --app "$APP_NAME" --json | jq -e '.[] | select(.name=="food_diary_data")' > /dev/null; then
            flyctl volumes create food_diary_data --app "$APP_NAME" --region "$REGION" --size 1 --yes
          fi

      - name: Set secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}" \
            --app "$APP_NAME"

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --remote-only --app "$APP_NAME"
          MACHINE_ID=$(flyctl machine list --app "$APP_NAME" --json | jq -r '.[0].id')
          echo "MACHINE_ID=$MACHINE_ID" >> "$GITHUB_ENV"

      # Temporary debugging: deploy success only means flyctl could update the
      # machine config, not that the app inside it is actually serving HTTP.
      - name: App status (debug)
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status --app "$APP_NAME" || true
          flyctl machine list --app "$APP_NAME" --json || true

      # Filtered to the machine this run deployed (-i) so output isn't
      # dominated by replayed history from previous machines/boots.
      - name: App logs (debug)
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: timeout 60 flyctl logs --app "$APP_NAME" -i "$MACHINE_ID" --no-tail || true

      # Fails the job if the app never comes up healthy, instead of always
      # reporting green regardless of outcome.
      - name: Healthcheck (debug)
        if: always()
        run: |
          for i in $(seq 1 18); do
            code=$(curl -sS --max-time 10 -o /dev/null -w "%{http_code}" "https://$APP_NAME.fly.dev/healthz" || echo "000")
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "App never returned HTTP 200 on /healthz"
          exit 1
