name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: fly-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # One-off: the existing machine's SQLite volume got corrupted by
      # repeated mid-write VM reboots (crash-loop on `prisma migrate deploy`,
      # "Schema engine error"). No real data exists on it (the app has never
      # booted successfully), so wipe both and let the next deploy recreate
      # them clean. Remove this step once confirmed working.
      - name: Reset corrupted machine + volume (one-off)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP_NAME=$(grep '^app =' fly.toml | sed -E 's/app = "(.*)"/\1/')
          flyctl machine list --app "$APP_NAME" --json | jq -r '.[].id' | while read -r id; do
            flyctl machine destroy "$id" --app "$APP_NAME" --force || true
          done
          flyctl volumes list --app "$APP_NAME" --json | jq -r '.[] | select(.name=="food_diary_data") | .id' | while read -r vid; do
            flyctl volumes destroy "$vid" --app "$APP_NAME" -y || true
          done

      # apps/volumes create is not safe to repeat, so each is gated on a
      # check first — this workflow runs on every push to main, not just once.
      - name: Ensure app and volume exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          APP_NAME=$(grep '^app =' fly.toml | sed -E 's/app = "(.*)"/\1/')
          REGION=$(grep '^primary_region =' fly.toml | sed -E 's/primary_region = "(.*)"/\1/')
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

          if ! flyctl apps list --json | jq -e --arg n "$APP_NAME" '.[] | select(.Name==$n)' > /dev/null; then
            flyctl apps create "$APP_NAME"
          fi

          if ! flyctl volumes list --app "$APP_NAME" --json | jq -e '.[] | select(.name=="food_diary_data")' > /dev/null; then
            flyctl volumes create food_diary_data --app "$APP_NAME" --region "$REGION" --size 1 --yes
          fi

      - name: Set secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            GOOGLE_REFRESH_TOKEN="${{ secrets.GOOGLE_REFRESH_TOKEN }}" \
            --app "$APP_NAME"

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app "$APP_NAME"

      # Temporary debugging: deploy success only means flyctl could update the
      # machine config, not that the app inside it is actually serving HTTP.
      - name: App status (debug)
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status --app "$APP_NAME" || true
          flyctl machine list --app "$APP_NAME" --json || true

      - name: App logs (debug)
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: sleep 30 && timeout 90 flyctl logs --app "$APP_NAME" --no-tail || true

      - name: Healthcheck (debug)
        if: always()
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://$APP_NAME.fly.dev/healthz" || echo "000")
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
