<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Match Week Food Diary</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="auth-screen" class="auth-screen" hidden>
      <div class="card auth-card">
        <h1 class="auth-title">Match Week Food Diary</h1>
        <div id="google-signin-btn" class="google-signin-btn" hidden></div>
        <p id="auth-divider" class="auth-divider" hidden><span>or</span></p>
        <form id="auth-form">
          <label for="auth-username">Username</label>
          <input type="text" id="auth-username" autocomplete="username" required />
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" autocomplete="current-password" required />
          <button type="submit" id="auth-submit">Log in</button>
          <p id="auth-error" class="error" hidden></p>
        </form>
        <p class="muted auth-toggle">
          <span id="auth-toggle-text">Don't have an account?</span>
          <button type="button" id="auth-toggle-btn" class="link-btn">Sign up</button>
        </p>
      </div>
    </div>

    <div id="app-shell" hidden>
      <header class="banner">
        <h1>Match Week Food Diary</h1>
        <div class="week-nav">
          <button id="week-prev" type="button" aria-label="Previous week">‹</button>
          <p id="week-range" class="muted">Loading…</p>
          <button id="week-next" type="button" aria-label="Next week" disabled>›</button>
        </div>
        <button id="settings-toggle" type="button" class="settings-toggle" aria-label="Settings">⚙</button>
      </header>

      <main>
        <section id="settings-card" class="card" hidden>
          <p class="muted">Signed in as <strong id="settings-username"></strong></p>
          <label for="settings-weekday">Week starts on</label>
          <select id="settings-weekday">
            <option value="0">Monday</option>
            <option value="1">Tuesday</option>
            <option value="2">Wednesday</option>
            <option value="3">Thursday</option>
            <option value="4">Friday</option>
            <option value="5">Saturday</option>
            <option value="6">Sunday</option>
          </select>
          <label for="settings-time">at</label>
          <input type="time" id="settings-time" />
          <button id="settings-save" type="button">Save</button>
          <p id="settings-error" class="error" hidden></p>
          <button id="logout-btn" type="button" class="ghost">Log out</button>
        </section>

        <p id="week-note" class="muted" hidden>Viewing a past week — go to the current week to log new entries.</p>

        <form id="entry-form" class="card">
          <label for="text">What did you eat?</label>
          <textarea
            id="text"
            name="text"
            rows="2"
            placeholder="e.g. chicken stir fry with rice, small handful of crisps"
          ></textarea>

          <label for="photo" class="photo-label">
            <span id="photo-status">📷 Add a photo (optional)</span>
            <input type="file" id="photo" name="photo" accept="image/*" />
          </label>

          <div id="log-week-row" class="log-week-row" hidden>
            <span class="muted">Count toward</span>
            <div class="log-week-btns">
              <button type="button" id="log-week-current" class="log-week-btn log-week-btn--active">This week</button>
              <button type="button" id="log-week-last" class="log-week-btn">Last week</button>
            </div>
          </div>
          <button type="submit" id="submit-btn">Log it</button>
          <p id="form-error" class="error" hidden></p>
        </form>

        <section id="result-card" class="card result" hidden>
          <p class="muted">Got it — looks right?</p>
          <p id="result-warning" class="error" hidden></p>
          <div id="result-rows"></div>
          <div class="result-actions">
            <button id="result-save" type="button">Save corrections</button>
            <button id="result-dismiss" type="button" class="ghost">Looks good</button>
          </div>
        </section>

        <section class="summary card">
          <div class="summary-total"><span id="week-total">0</span> kcal this week</div>
          <div class="muted"><span id="week-avg">0</span> kcal/day avg over <span id="days-logged">0</span> day(s) logged</div>
          <div id="daily-totals" class="day-totals"></div>
          <p id="pending-note" class="error" hidden></p>
          <a id="export-pdf" class="button-link" href="/api/match-weeks/current/report.pdf">Export PDF</a>
        </section>

        <section>
          <h2>This week</h2>
          <div id="entry-list"></div>
        </section>
      </main>
    </div>

    <script>
      // Defined here (not in app.js) so it exists no matter which of the two
      // scripts below finishes loading first — app.js is same-origin and
      // usually wins the race, but on a slow connection to this app's own
      // server the external Google script can finish first, and onload
      // can only fire once: if app.js hadn't defined this callback yet at
      // that moment, the signal would be silently lost.
      window.__gsiReady = false;
      window.__onGsiLoad = function () {
        window.__gsiReady = true;
      };
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer onload="window.__onGsiLoad()"></script>
    <script src="/app.js"></script>
  </body>
</html>
