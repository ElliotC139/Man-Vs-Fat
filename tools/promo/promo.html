<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>QuicKcals Promo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The source for the social-media promo video (tools/promo/out/*.mp4):
      1080x1920, for Reels, TikTok and Shorts.

      Every frame is a pure function of time. seek(t) lays the whole stage out
      for second t and resolves once any image it needs has decoded, so the
      renderer can step through the timeline a frame at a time and get the
      same picture on every run. Opened in a browser, the page plays itself on
      a loop, which is the quickest way to review a change.

      Nothing on the phone is drawn. Its screen shows frames of the real app,
      filmed by capture/capture.mjs, and the running order lives in
      timeline.js, which audio/score.py reads too.
    -->
    <link rel="stylesheet" href="fonts/fonts.css" />
    <script src="timeline.js"></script>
    <style>
      :root { --grey: #86868b; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { background: #000; height: 100%; overflow: hidden; }
      body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

      #stage {
        position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
        background: #000; overflow: hidden; color: #f5f5f7; transform-origin: 0 0;
      }
      .abs { position: absolute; }
      .scene { position: absolute; inset: 0; }
      .grad {
        background: linear-gradient(100deg, #7fe3a8 0%, #2ec26b 45%, #1f9d52 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .w { display: inline-block; }

      .glow {
        position: absolute; width: 1500px; height: 1500px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(46, 194, 107, 0.34), rgba(23, 107, 58, 0.12) 55%, transparent);
        filter: blur(40px);
      }

      #s1 .mark { left: 390px; top: 620px; width: 300px; height: 300px; }
      #s1 .wordmark {
        left: 0; right: 0; top: 980px; text-align: center;
        font-family: Montserrat, sans-serif; font-weight: 800; font-size: 132px; letter-spacing: -0.03em; color: #fff;
      }
      .big { left: 60px; right: 60px; text-align: center; font-weight: 800; font-size: 150px; line-height: 1.02; letter-spacing: -0.045em; }

      .cap { position: absolute; left: 40px; right: 40px; top: 140px; text-align: center; }
      .cap h2 { font-weight: 800; font-size: 104px; line-height: 1.02; letter-spacing: -0.045em; color: #f5f5f7; }
      .cap p, .cap .sub { margin-top: 24px; font-weight: 500; font-size: 38px; line-height: 1.25; color: var(--grey); letter-spacing: -0.01em; }

      /* The phone. Its screen is 393x852 points (iPhone 15 Pro) at 560px wide. */
      #phoneWrap { position: absolute; inset: 0; perspective: 2600px; }
      #phone {
        position: absolute; left: 239px; top: 604px; width: 602px; height: 1256px; border-radius: 100px;
        background: linear-gradient(145deg, #5b5f63, #2a2c2f 30%, #4a4d51 55%, #1d1f21 80%, #55595d);
        box-shadow: 0 60px 120px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
      }
      #phone .bezel { position: absolute; inset: 7px; border-radius: 93px; background: #050505; padding: 14px; }
      #phone .screen { position: relative; width: 560px; height: 1214px; border-radius: 79px; overflow: hidden; background: #f6f7f4; }
      #phone .screen img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #phone .island { position: absolute; top: 16px; left: 50%; width: 180px; height: 53px; margin-left: -90px; border-radius: 27px; background: #000; z-index: 5; }
      #phone .btn { position: absolute; width: 8px; border-radius: 3px; background: linear-gradient(90deg, #3a3d40, #6a6e72); }
      .glare {
        position: absolute; inset: 0; border-radius: 79px; pointer-events: none; z-index: 6;
        background: linear-gradient(115deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 28%, transparent 40%);
      }

      .tile {
        position: absolute; width: 440px; height: 270px; border-radius: 48px; padding: 44px 40px;
        background: linear-gradient(160deg, #1d1f21, #131415); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.07);
      }
      .tile h3 { font-size: 52px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; }
      .tile p { margin-top: 18px; font-size: 29px; font-weight: 500; color: var(--grey); line-height: 1.25; letter-spacing: -0.01em; }

      .pill {
        position: absolute; left: 50%; padding: 30px 72px; border-radius: 999px;
        background: linear-gradient(180deg, #2ec26b, #1f9d52); color: #fff; font-weight: 700; font-size: 46px;
        letter-spacing: -0.02em; white-space: nowrap; box-shadow: 0 20px 60px rgba(46, 194, 107, 0.35);
      }
    </style>

    <div id="stage">
      <div class="glow" id="glowA"></div>
      <div class="glow" id="glowB"></div>

      <div class="scene" id="s1">
        <svg class="abs mark" viewBox="-6.15 -19.2 440 440" aria-hidden="true"><use href="#bubble" /><use href="#kf" /></svg>
        <div class="abs wordmark" id="wm"></div>
      </div>

      <div class="scene" id="s2">
        <div class="abs big" style="top: 560px" data-words="Calorie"></div>
        <div class="abs big" style="top: 715px" data-words="counting."></div>
        <div class="abs big" style="top: 930px" data-words="Without the" data-grad="1"></div>
        <div class="abs big" style="top: 1085px" data-words="counting." data-grad="1"></div>
      </div>

      <div class="scene" id="caps"></div>

      <div id="phoneWrap">
        <div id="phone">
          <div class="btn" style="left: -6px; top: 240px; height: 58px"></div>
          <div class="btn" style="left: -6px; top: 330px; height: 104px"></div>
          <div class="btn" style="left: -6px; top: 450px; height: 104px"></div>
          <div class="btn" style="right: -6px; top: 360px; height: 160px"></div>
          <div class="bezel">

              <img id="app" alt="" />
              <div class="island"></div>
            </div>
            <div class="glare"></div>
          </div>
        </div>
      </div>

      <div class="scene" id="s7">
        <div class="cap" style="top: 250px"><h2 data-words="And everything else." style="font-size: 96px"></h2></div>
        <div id="tiles"></div>
        <div class="abs" id="freeLine" style="left: 0; right: 0; top: 1600px; text-align: center; font-size: 42px; font-weight: 600; color: var(--grey); letter-spacing: -0.01em">Most of it free. <span style="color: #f5f5f7">Forever.</span></div>
      </div>

      <div class="scene" id="s8">
        <svg class="abs" id="endMark" viewBox="-6.15 -19.2 440 440" style="left: 410px; top: 470px; width: 260px; height: 260px"><use href="#bubble" /><use href="#kf" /></svg>
        <div class="abs" id="endWm" style="left: 0; right: 0; top: 780px; text-align: center; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 140px; letter-spacing: -0.03em; color: #fff">QuicKcals</div>
        <div class="abs" id="endTag" style="left: 60px; right: 60px; top: 990px; text-align: center; font-size: 60px; font-weight: 700; line-height: 1.12; letter-spacing: -0.035em; color: #f5f5f7">The calorie diary that<br /><span class="grad">stops being work.</span></div>

    <script>
      const T = window.TIMELINE;
      const FPS = 60; // the capture rate of the app footage

      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const p = (t, a, b) => clamp((t - a) / (b - a));
      const lerp = (a, b, x) => a + (b - a) * x;
      const outCubic = (x) => 1 - Math.pow(1 - x, 3);
      const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
      const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const inCubic = (x) => x * x * x;
      const outBack = (x) => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
      const $ = (id) => document.getElementById(id);

      /* ── Build ─────────────────────────────────────────────────────── */

      $('caps').innerHTML = T.beats
        .map(
          (b, i) => `<div class="cap" id="cap${i}">
            <h2 data-words="${b.title[0]}"></h2><h2 data-words="${b.title[1]}" data-grad="1"></h2>
            <p class="sub">${b.sub}</p>
          </div>`,
        )
        .join('');

      document.querySelectorAll('[data-words]').forEach((el) => {
        const grad = el.dataset.grad;
        el.innerHTML = el.dataset.words
          .split(' ')
          .map((w) => `<span class="w${grad ? ' grad' : ''}">${w}</span>`)
          .join(' ');
      });
      $('wm').innerHTML = [...'QuicKcals'].map((c) => `<span class="w">${c}</span>`).join('');

      const TILES = [
        ['Snap a photo.', 'The plate becomes the log.'],
        ['Scan a barcode.', 'Millions of packets, looked up.'],
        ['Works offline.', 'Logs on the Tube. Syncs later.'],
        ['WHOOP.', 'Burn measured, not guessed.'],
        ['Keto & fasting.', 'Net carbs and an eating window.'],
        ['Yours alone.', 'Never sold. Export any time.'],
      ];
      $('tiles').innerHTML = TILES.map(
        ([h, t], i) =>
          `<div class="tile" style="left:${80 + (i % 2) * 480}px;top:${520 + Math.floor(i / 2) * 310}px"><h3 class="${i % 3 === 0 ? 'grad' : ''}">${h}</h3><p>${t}</p></div>`,
      ).join('');

      /* ── Helpers ───────────────────────────────────────────────────── */

      // Words rise out of a blur, one after another, and leave together.
      function words(el, t, tin, tout, stagger = 0.07) {
        const o = tout == null ? 0 : outCubic(p(t, tout, tout + 0.4));
        el.querySelectorAll('.w').forEach((w, i) => {
          const e = outExpo(p(t, tin + i * stagger, tin + i * stagger + 0.9));
          w.style.opacity = e * (1 - o);
          w.style.transform = `translateY(${(1 - e) * 70 - o * 40}px)`;
          const b = (1 - e) * 16 + o * 12;
          w.style.filter = b > 0.1 ? `blur(${b}px)` : 'none';
        });
      }
      const show = (el, on) => ((el.style.display = on ? '' : 'none'), on);

      // The recorded frame the phone shows at time t (see T.frameAt).
      function appFrame(t) {
        const { clip, frame } = T.frameAt(t);
        return `capture/clips/${clip}/${String(Math.max(1, frame)).padStart(5, '0')}.jpg`;
      }

      // A caption: the title's words rise in turn, then the sub-line fades
      // up whole, and all of it leaves together. Only ever over a still screen.
      function caption(el, t, b) {
        const [h1, h2] = el.querySelectorAll('h2');
        words(h1, t, b.start, b.outAt, 0.08);
        words(h2, t, b.start + 0.22, b.outAt, 0.08);
        const sub = el.querySelector('.sub');
        const e = outCubic(p(t, b.start + 0.45, b.start + T.capIn));
        const o = outCubic(p(t, b.outAt, b.outAt + T.capOut));
        sub.style.opacity = e * (1 - o);
        sub.style.transform = `translateY(${(1 - e) * 14}px)`;
      }

      /* ── seek(t) ───────────────────────────────────────────────────── */

      async function seek(t) {
        const ga = $('glowA'), gb = $('glowB');
        ga.style.left = `${-500 + Math.sin(t * 0.35) * 160}px`;
        ga.style.top = `${900 + Math.cos(t * 0.27) * 220}px`;
        gb.style.left = `${200 + Math.cos(t * 0.3) * 180}px`;
        gb.style.top = `${-300 + Math.sin(t * 0.22) * 200}px`;
        const g = 0.35 + 0.65 * p(t, 0.3, 2) - 0.4 * (p(t, 2.8, 3.3) - p(t, 5.6, 6.6)) + 0.3 * p(t, T.endIn + 0.4, T.endIn + 1.5);
        ga.style.opacity = g;
        gb.style.opacity = g * 0.8;

        /* The mark lands; the name spells itself out. */
        if (show($('s1'), t < 3.4)) {
          const e = outExpo(p(t, 0.15, 1.5));
          const out = inCubic(p(t, 2.6, 3.1));
          const m = document.querySelector('#s1 .mark');
          m.style.opacity = e * (1 - out);
          m.style.transform = `translateY(${(1 - e) * 60 - out * 120}px) scale(${lerp(0.55, 1, e) * (1 + out * 0.4)})`;
          m.style.filter = `blur(${(1 - e) * 22 + out * 20}px) drop-shadow(0 0 ${40 * e}px rgba(46,194,107,.55))`;
          $('wm').querySelectorAll('.w').forEach((c, i) => {
            const ce = outExpo(p(t, 0.9 + i * 0.05, 1.8 + i * 0.05));
            c.style.opacity = ce * (1 - out);
            c.style.transform = `translateY(${(1 - ce) * 50 - out * 60}px)`;
            c.style.filter = `blur(${(1 - ce) * 10 + out * 14}px)`;
          });
        }

        /* The promise. The last word lands on the downbeat before the drop. */
        if (show($('s2'), t > 2.8 && t < 6.0)) {
          const b = document.querySelectorAll('#s2 .big');
          words(b[0], t, 2.9, 5.3);
          words(b[1], t, 3.3, 5.3);
          words(b[2], t, 4.2, 5.35);
          words(b[3], t, 4.6, 5.4);
          $('s2').style.transform = `scale(${1 + p(t, 3, 6.4) * 0.06})`;
        }

        /* Captions over the phone. */
        if (show($('caps'), t > T.phoneIn && t < T.phoneOut + 0.6)) {
          T.beats.forEach((b, i) => {
            const el = $(`cap${i}`);
            if (show(el, t > b.start - 0.05 && t < b.end + 0.05)) caption(el, t, b);
          });
        }

        /* The phone rises in, floats, and drops away. */
        let pending = null;
        if (show($('phoneWrap'), t > T.phoneIn && t < T.phoneOut + 1)) {
          const inE = outExpo(p(t, T.phoneIn, T.phoneIn + 1.2));
          const outE = inOut(p(t, T.phoneOut, T.phoneOut + 0.8));
          const y = (1 - inE) * 1500 + outE * 1500 + Math.sin(t * 1.1) * 5;
          const rx = (1 - inE) * 32 - outE * 20;
          const ry = Math.sin(t * 0.9) * 2.5 + Math.sin(t * 0.55) * 1.5;
          // Push in on the ring whenever it moves: [in, hold until, out].
          let zoom = 0;
          // In on the ring before it moves, out once it has settled.
          for (const b of T.beats) {
            if (!b.pushAt) continue;
            const [a, z] = b.pushAt;
            zoom = Math.max(zoom, inOut(p(t, a - 0.6, a)) * (1 - inOut(p(t, z, z + 0.6))));
          }
          const z = 1 + zoom * 0.32;
          $('phone').style.transformOrigin = '301px 210px'; // the ring, on the phone
          $('phone').style.transform = `translateY(${y + zoom * 40}px) rotateX(${rx}deg) rotateY(${ry * (1 - zoom)}deg) scale(${(lerp(0.86, 1, inE) - outE * 0.1) * z})`;
          const img = $('app');
          const src = appFrame(t);
          if (img.getAttribute('src') !== src) {
            img.setAttribute('src', src);
            pending = img.decode().catch(() => {});
          }
        }

        /* Everything else. */
        if (show($('s7'), t > T.tilesIn - 0.2 && t < T.endIn + 0.8)) {
          const a = T.tilesIn;
          const out = inCubic(p(t, T.endIn - 0.4, T.endIn + 0.1));
          words(document.querySelector('#s7 h2'), t, a, T.endIn - 0.4);
          document.querySelectorAll('.tile').forEach((el, i) => {
            const s = a + 1.0 + Math.floor(i / 2) * 0.6 + (i % 2) * 0.12; // a row at a time
            const e = outBack(p(t, s, s + 0.8));
            el.style.opacity = clamp(p(t, s, s + 0.35)) * (1 - out);
            el.style.transform = `translateY(${(1 - e) * 120 - out * 60}px) scale(${lerp(0.82, 1, e) - out * 0.05})`;
          });
          const f = outExpo(p(t, a + 3.2, a + 4.0));
          $('freeLine').style.opacity = f * (1 - out);
          $('freeLine').style.transform = `translateY(${(1 - f) * 30}px)`;
        }

        /* The end card. */
        if (show($('s8'), t > T.endIn - 0.1)) {
          const a = T.endIn;
          const m = outExpo(p(t, a, a + 1.2));
          $('endMark').style.opacity = m;
          $('endMark').style.transform = `translateY(${(1 - m) * 60}px) scale(${lerp(0.6, 1, m)})`;
          $('endMark').style.filter = `blur(${(1 - m) * 18}px) drop-shadow(0 0 ${50 * m}px rgba(46,194,107,.5))`;
          [['endWm', 0.4], ['endTag', 1.1], ['endBtn', 2.0], ['endSub', 2.4], ['endUrl', 2.8]].forEach(([id, d]) => {
            const e = outExpo(p(t, a + d, a + d + 1));
            const el = $(id);
            el.style.opacity = e;
            const breathe = id === 'endBtn' && t > a + 3.2 ? ` scale(${1 + Math.sin((t - a - 3.2) * 3) * 0.02})` : '';
            el.style.transform = `${id === 'endBtn' ? 'translateX(-50%) ' : ''}translateY(${(1 - e) * 50}px)${breathe}`;
            el.style.filter = e < 0.99 ? `blur(${(1 - e) * 12}px)` : 'none';
          });
        }

        return pending;
      }

      /* ── Driving it ────────────────────────────────────────────────── */

      window.DURATION = T.duration;
      window.seek = seek;
      if (!new URLSearchParams(location.search).has('render')) {
        const fit = () => {
          const s = Math.min(innerWidth / 1080, innerHeight / 1920);
          const st = $('stage');
          st.style.transform = `scale(${s})`;
          st.style.left = `${(innerWidth - 1080 * s) / 2}px`;
          st.style.top = `${(innerHeight - 1920 * s) / 2}px`;
        };
        addEventListener('resize', fit);
        fit();
        document.fonts.ready.then(() => {
          const start = performance.now();
          const tick = (now) => {
            seek(((now - start) / 1000) % (T.duration + 1));
            requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        });
      }
      seek(0);
    </script>
  </body>
</html>
